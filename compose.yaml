name: stul
services:
  app:
    image: ${STUL_APP_IMAGE:-stul-app:local}
    build:
      context: .
      args:
        STUL_REVISION: ${STUL_BOOTSTRAP_REVISION:-unknown}
    container_name: ${STUL_APP_CONTAINER:-stul-app}
    restart: unless-stopped
    init: true
    ports:
      - "${STUL_BIND:-127.0.0.1}:${STUL_PORT:-8080}:8080"
    environment:
      STUL_ROOM_CREATE_RATE: ${STUL_ROOM_CREATE_RATE:-100}
      STUL_ROOM_LIMIT: ${STUL_ROOM_LIMIT:-1000}
      STUL_ROOM_BYTES_LIMIT: ${STUL_ROOM_BYTES_LIMIT:-256000000}
      STUL_LIVEKIT_URL: ${STUL_LIVEKIT_URL:-}
      STUL_LIVEKIT_API_KEY: ${STUL_LIVEKIT_API_KEY:-}
      STUL_LIVEKIT_API_SECRET: ${STUL_LIVEKIT_API_SECRET:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Nastav PUBLIC_ORIGIN v .env}
      STUL_ADMIN_PASSWORD: ${STUL_ADMIN_PASSWORD:?Nastav heslo spravce v .env}
      STUL_UPDATER_TOKEN: ${STUL_UPDATER_TOKEN:?Nastav token aktualizatoru v .env}
      STUL_UPDATER_URL: http://updater:8090
    volumes:
      - data:/data
    networks: [table]
  updater:
    build:
      context: .
      dockerfile: deploy/updater/Dockerfile
    restart: unless-stopped
    environment:
      STUL_UPDATER_TOKEN: ${STUL_UPDATER_TOKEN:?Nastav token aktualizatoru v .env}
      STUL_APP_CONTAINER: ${STUL_APP_CONTAINER:-stul-app}
      STUL_UPDATE_CHANNEL: ${STUL_UPDATE_CHANNEL:-stable}
      STUL_BACKUP_KEEP: ${STUL_BACKUP_KEEP:-0}
      STUL_HOSTING_CONFIG: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - ./.stul-state:/state
    networks: [table]
volumes:
  data:
networks:
  table:
