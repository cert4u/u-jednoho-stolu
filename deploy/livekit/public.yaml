# Veřejný server: HTTPS/WSS reverzní proxy a firewall dle docs/VOICE.md.
port: 7880
bind_addresses: [0.0.0.0]
rtc:
  use_external_ip: true
  tcp_port: 7881
  udp_port: 7882
room:
  max_participants: 12
logging:
  level: warn
