name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalace uzamčených závislostí
        run: npm run install:ci
      - name: Dokumentace
        run: npm run check:docs
      - name: TypeScript
        run: npm run check
      - name: Geometrie mapy
        run: npm test
      - name: Sestavení
        run: npm run build
      - name: Místní databáze
        run: npm run db:init
      - name: Integrační testy
        run: npm run test:ci
      - name: Node hosting a správa instalace
        run: npm run build:node && npm run test:hosting

  docker:
    name: Docker hosting and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm run test:updater
      - name: Validate compose configuration
        run: |
          cp .env.example .env
          echo 'STUL_ADMIN_PASSWORD=test-admin-password-long-enough' >> .env
          echo 'STUL_UPDATER_TOKEN=test-updater-token-long-enough-123456' >> .env
          ./deploy/stul.sh config --quiet
          STUL_LIVEKIT_API_KEY=test-voice-key STUL_LIVEKIT_API_SECRET=test-voice-secret-with-at-least-32-characters docker compose -f compose.yaml -f compose.voice.yaml config --quiet
      - name: Test real Docker replacement and recovery
        run: sudo "$(command -v node)" scripts/test-docker.mjs
