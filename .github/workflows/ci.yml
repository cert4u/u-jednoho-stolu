name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalace uzamčených závislostí
        run: npm run install:ci
      - name: Dokumentace
        run: npm run check:docs
      - name: Formát upravovaných modulů
        run: npm run format:check
      - name: Herní obsah
        run: npm run check:content
      - name: Lint bez nových nálezů
        run: npm run lint:baseline
      - name: TypeScript
        run: npm run check
      - name: Geometrie mapy
        run: npm test
      - name: Sestavení
        run: npm run build
      - name: Soukromí v klientském buildu
        run: npm run check:client-content
      - name: Integrační testy
        run: npm run test:ci
      - name: Node hosting a správa instalace
        run: npm run build:node && npm run check:client-content && npm run test:hosting && npm run test:stabilization

  docker:
    name: Docker hosting and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: ['0.5.3', '1.2.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm run test:updater
      - name: Validate compose configuration
        run: |
          cp .env.example .env
          echo 'STUL_ADMIN_PASSWORD=test-admin-password-long-enough' >> .env
          echo 'STUL_UPDATER_TOKEN=test-updater-token-long-enough-123456' >> .env
          ./deploy/stul.sh config --quiet
          STUL_LIVEKIT_API_KEY=test-voice-key STUL_LIVEKIT_API_SECRET=test-voice-secret-with-at-least-32-characters docker compose -f compose.yaml -f compose.voice.yaml config --quiet
      - name: Test real Docker replacement and recovery
        run: |
          legacy_source=$(mktemp -d)
          trap 'rm -rf "$legacy_source"' EXIT
          if [ "${{ matrix.base }}" = "1.2.1" ]; then
            legacy_sha=ef59634d1a5f7ff94d76201cc187dea99c73e0c3
          else
            legacy_sha=65382686749237b930bf0cb918761198e6ad6b2c
          fi
          git fetch --no-tags --depth=1 origin "$legacy_sha"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$legacy_sha"
          git archive "$legacy_sha" | tar -x -C "$legacy_source"
          # 99.0.0 is an isolated image fixture so the updater can test a newer version.
          # No package version, Git tag or GitHub Release is created.
          sudo env STUL_DOCKER_BASE_VERSION="${{ matrix.base }}" STUL_DOCKER_BASE_REVISION="$legacy_sha" STUL_DOCKER_TARGET_VERSION=99.0.0 "$(command -v node)" scripts/test-docker.mjs "$legacy_source"
